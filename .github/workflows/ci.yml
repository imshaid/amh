# Checks every push and pull request, then deploys pushed branches to a Cloudflare Pages preview.
# The check job mirrors `npm run check`, split into steps so a failure names the stage; the
# database job mirrors `npm run check:stack` against a local Supabase stack started on the runner.
#
# Repository settings used (Settings → Secrets and variables → Actions):
#   variables  VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY  public values for the hosted project
#              CLOUDFLARE_ACCOUNT_ID                             enables the preview job
#   secret     CLOUDFLARE_API_TOKEN                              Account → Cloudflare Pages: Edit
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck, lint, format, unit tests
        run: npm run verify

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Scan the bundle for secrets
        run: npm run check:bundle

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and its system libraries
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke tests
        run: npm run e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Upload the production build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  database:
    name: Database and sign-in
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Only what the checks use: Postgres, Auth, the Data API, Storage, the gateway and the Edge
      # Runtime. Migrations apply on start; the Edge Function gets its local-only pepper from
      # supabase/config.toml.
      - name: Start the local Supabase stack
        run: npx supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor,realtime,postgres-meta

      - name: Lint database functions
        run: npm run db:lint

      - name: Database tests (pgTAP)
        run: npm run db:test

      - name: Generated types match the migrations
        run: npm run db:types -- --check

      - name: Integration tests (Edge Function, Auth, RLS, Storage)
        run: npm run test:integration

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and its system libraries
        run: npx playwright install --with-deps chromium

      - name: Sign-in end-to-end tests
        run: npm run e2e:stack

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-stack
          path: apps/web/playwright-report-stack
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: npx supabase stop --no-backup

  preview:
    name: Preview deploy
    needs: [check, database]
    # Skipped (not failed) until Cloudflare is connected through the variable and secret above.
    if: github.event_name == 'push' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist

      - name: Deploy to Cloudflare Pages
        id: deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          # The project's production branch is `production`, so every branch, main included,
          # deploys as a preview until launch (Segment 14).
          if ! npx wrangler pages project list --json \
            | node -e 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); process.exit(p.some((x) => (x["Project Name"] ?? x.name) === "amh") ? 0 : 1)'; then
            npx wrangler pages project create amh --production-branch production
          fi
          npx wrangler pages deploy --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA" | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview for \`$GITHUB_REF_NAME\`: $url" >> "$GITHUB_STEP_SUMMARY"
